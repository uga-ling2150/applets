name: Applet accessibility (persona)
on:
  pull_request:
  push:
    branches: [codex/oct21-persona]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix tools/a11y --no-package-lock
      - run: tools/a11y/node_modules/.bin/playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 --directory docs > /tmp/applet-server.log 2>&1 &
      - run: node tools/a11y/check.mjs docs/week_11/11A_style_persona.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-accessibility-report-and-screenshots
          path: a11y-results/
